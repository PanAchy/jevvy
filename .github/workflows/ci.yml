name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

env:
  NPM_VERSION: 11.19.1

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: git diff --exit-code

  package-smoke:
    name: Package smoke (${{ matrix.name }})
    if: github.head_ref == 'changeset-release/main' || contains(github.event.pull_request.labels.*.name, 'full-package-smoke')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            architecture: x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
          - name: Windows x64
            runner: windows-2025
            platform: win32
            architecture: x64
          - name: Windows arm64
            runner: windows-11-arm
            platform: win32
            architecture: arm64
          - name: macOS x64
            runner: macos-15-intel
            platform: darwin
            architecture: x64
          - name: macOS arm64
            runner: macos-15
            platform: darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --no-audit --no-fund
      - run: npm run smoke:package
        env:
          JEVVY_EXPECT_PLATFORM: ${{ matrix.platform }}
          JEVVY_EXPECT_ARCH: ${{ matrix.architecture }}

  opencode-smoke:
    name: OpenCode host smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --no-audit --no-fund
      - run: npm run smoke:opencode
