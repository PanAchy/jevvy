name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

env:
  NPM_VERSION: 11.19.1
  CLAUDE_CODE_VERSION: 2.1.296

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19
          cache: npm
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: git diff --exit-code

  package-smoke:
    name: Package smoke (${{ matrix.name }})
    if: github.head_ref == 'changeset-release/main' || contains(github.event.pull_request.labels.*.name, 'full-package-smoke')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            architecture: x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
          - name: Windows x64
            runner: windows-2025
            platform: win32
            architecture: x64
          - name: Windows arm64
            runner: windows-11-arm
            platform: win32
            architecture: arm64
          - name: macOS x64
            runner: macos-15-intel
            platform: darwin
            architecture: x64
          - name: macOS arm64
            runner: macos-15
            platform: darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19
          cache: npm
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --no-audit --no-fund
      - run: npm run smoke:package
        env:
          JEVVY_EXPECT_PLATFORM: ${{ matrix.platform }}
          JEVVY_EXPECT_ARCH: ${{ matrix.architecture }}
          JEVVY_SMOKE_TRACE: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: package-history-failure-${{ matrix.platform }}-${{ matrix.architecture }}
          path: .agents/smoke-artifacts/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  opencode-smoke:
    name: OpenCode host smoke (${{ matrix.opencode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        opencode: ["2.0.27", "2.2.0"]
    env:
      JEVVY_OPENCODE_VERSION: ${{ matrix.opencode }}
      JEVVY_SMOKE_TRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19
          cache: npm
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --no-audit --no-fund
      - run: npm run smoke:opencode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: opencode-history-failure-${{ matrix.opencode }}
          path: .agents/smoke-artifacts/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  claude-smoke:
    name: Claude Code plugin smoke
    runs-on: ubuntu-24.04
    env:
      JEVVY_SMOKE_TRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19
          cache: npm
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - run: npm ci --no-audit --no-fund
      - run: npm install --global @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
      - run: npm run build:permissions
      - run: node scripts/claude-history-smoke.mjs packages/permissions
      - run: npm run smoke:claude
      - run: npm run smoke:claude:permissions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: claude-permission-smoke-failure
          path: |
            /tmp/jevvy-claude-permissions-*/results.json
            /tmp/jevvy-claude-permissions-*/*/terminal.txt
            /tmp/jevvy-claude-permissions-*/*/observations.json
            /tmp/jevvy-claude-permissions-*/*/debug.log
            /tmp/jevvy-claude-permissions-*/*/home/.config/jevvy/metrics/**
            .agents/smoke-artifacts/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
